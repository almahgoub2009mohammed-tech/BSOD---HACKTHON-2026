<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>واجهة تحكم بسيطة</title>
    <style>
        /* تنسيق الخلفية والجسم */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* حاوية الواجهة */
        .control-panel {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        /* تنسيق الزرار */
        .main-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }

        /* تأثير عند مرور الماوس */
        .main-button:hover {
            background-color: #0056b3;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
        }

        /* تأثير عند الضغط */
        .main-button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <h2>لوحة التحكم</h2>
        <button class="main-button" onclick="alert('تم الضغط بنجاح يا باشا!')">اضغط هنا</button>
    </div>

</body>
</html>
