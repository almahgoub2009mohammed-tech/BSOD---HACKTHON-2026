<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>BSOD Cleaning Simulation</title>
        <link rel="stylesheet" href="style.css" />
        </head>
        <body>
          <main class="simulation">
              <div class="scene" id="scene">
                    <button id="playBtn">تشغيل المحاكاة</button>
                    
                          <div class="notification">
                                  <b>حساس الاتساخ</b>
                                          <span>تم تحديد منطقة متسخة بشدة</span>
                                                </div>
                                                
                                                      <div class="panel-wrap">
                                                              <div class="panel">
                                                                        <div class="target-indicator"></div>
                                                                                  <div class="shine"></div>
                                                                                  
                                                                                            <div class="dirty-zone">
                                                                                                        <span>Dirty Spot</span>
                                                                                                                  </div>
                                                                                                                  
                                                                                                                            <div class="dust d1"></div>
                                                                                                                                      <div class="dust d2"></div>
                                                                                                                                                <div class="dust d3"></div>
                                                                                                                                                          <div class="dust d4"></div>
                                                                                                                                                                    <div class="dust d5"></div>
                                                                                                                                                                              <div class="dust d6"></div>
                                                                                                                                                                              
                                                                                                                                                                                        <div class="liquid l1"></div>
                                                                                                                                                                                                  <div class="liquid l2"></div>
                                                                                                                                                                                                            <div class="liquid l3"></div>
                                                                                                                                                                                                                      <div class="liquid l4"></div>
                                                                                                                                                                                                                                <div class="liquid l5"></div>
                                                                                                                                                                                                                                
                                                                                                                                                                                                                                          <svg class="field" viewBox="0 0 900 360" preserveAspectRatio="none">
                                                                                                                                                                                                                                                      <path d="M130 175 C260 80, 410 80, 540 175 S740 270, 840 175"/>
                                                                                                                                                                                                                                                                  <path d="M130 220 C285 145, 430 145, 560 220 S730 295, 840 220"/>
                                                                                                                                                                                                                                                                              <path d="M130 130 C270 40, 430 40, 555 130 S730 235, 840 130"/>
                                                                                                                                                                                                                                                                                        </svg>
                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                            <div class="cart">
                                                                                                                                                                                                                                                                                                                    <div class="cart-body">
                                                                                                                                                                                                                                                                                                                              <span>BSOD</span>
                                                                                                                                                                                                                                                                                                                                        <small>Smart Cleaner</small>
                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                        <div class="tank"></div>
                                                                                                                                                                                                                                                                                                                                                                <div class="arm"></div>
                                                                                                                                                                                                                                                                                                                                                                        <div class="nozzle"></div>
                                                                                                                                                                                                                                                                                                                                                                                <div class="vacuum"></div>
                                                                                                                                                                                                                                                                                                                                                                                        <div class="magnet">MAG</div>
                                                                                                                                                                                                                                                                                                                                                                                                <div class="wheel w1"></div>
                                                                                                                                                                                                                                                                                                                                                                                                        <div class="wheel w2"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                <div class="spray"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="suction"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                    </main>
                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                      <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                      </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                      </html>
                                                                                                                                                                                                                                                                                                                                                                                                                                      >
