<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Robot Vehicle with Dark Smoke</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(180deg, #e9e9e9, #bdbdbd);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .vehicle {
    position: relative;
    width: 430px;
    height: 170px;
  }

  /* --- تأثير الدخان الداكن --- */
  .smoke-container {
    position: absolute;
    left: 192px; /* تم تعديله ليتوسط المدخنة */
    bottom: 240px; /* مكان خروج الدخان */
    width: 20px;
    height: 100px;
  }

  .smoke {
    position: absolute;
    bottom: 0;
    width: 18px; /* تكبير الحجم قليلاً */
    height: 18px;
    /* --- تعديل اللون: رمادي داكن جداً وشبه معتم --- */
    background: rgba(30, 30, 30, 0.9);
    border-radius: 50%;
    opacity: 0;
    filter: blur(4px); /* تقليل التغبيش قليلاً ليظل داكناً */
    animation: rise 2s infinite ease-out;
  }

  /* جعل جزيئات الدخان تخرج بتوقيتات وأماكن مختلفة قليلاً */
  .smoke:nth-child(2) { animation-delay: 0.6s; left: 6px; }
  .smoke:nth-child(3) { animation-delay: 1.2s; left: -4px; }
  .smoke:nth-child(4) { animation-delay: 1.8s; left: 2px; } /* إضافة جزئ رابع */

  @keyframes rise {
    0% {
      transform: translateY(0) scale(1);
      opacity: 0;
    }
    15% {
      /* يظهر الدخان بسرعة ويكون داكناً جداً */
      opacity: 1;
    }
    100% {
      /* يرتفع، يكبر حجمه، ويتلاشى */
      transform: translateY(-150px) scale(5);
      opacity: 0;
    }
  }

  /* --- باقي عناصر السيارة (دون تغيير) --- */
  .body {
    position: absolute;
    bottom: 28px;
    width: 430px;
    height: 105px;
    background: linear-gradient(180deg, #ffffff 0%, #f1f1f1 100%);
    border: 4px solid #3f3f3f;
    border-radius: 42px 42px 28px 28px;
    box-shadow: 0 18px 30px rgba(0,0,0,0.25);
    z-index: 2;
  }

  .body::after {
    content: "";
    position: absolute;
    top: 52px;
    left: 22px;
    right: 22px;
    height: 3px;
    background: #8a8a8a;
    border-radius: 10px;
  }

  .cabin {
    position: absolute;
    left: 145px;
    bottom: 108px;
    width: 160px;
    height: 78px;
    background: linear-gradient(180deg, #ffffff 0%, #eeeeee 100%);
    border: 4px solid #3f3f3f;
    border-radius: 34px 46px 24px 24px;
    box-shadow: 0 8px 15px rgba(0,0,0,0.15);
    z-index: 1;
  }

  .cabin::after {
    content: "";
    position: absolute;
    right: -38px;
    bottom: -4px;
    width: 70px;
    height: 78px;
    background: linear-gradient(180deg, #ffffff 0%, #eeeeee 100%);
    border-right: 4px solid #3f3f3f;
    border-bottom: 4px solid #3f3f3f;
    border-radius: 0 45px 24px 0;
    transform: skewX(28deg);
  }

  .pipe {
    position: absolute;
    left: 185px;
    bottom: 185px;
    width: 34px;
    height: 62px;
    background: linear-gradient(90deg, #111, #333, #111);
    border-radius: 12px;
    border: 4px solid #111;
    z-index: 0;
  }

  .pipe::before {
    content: "";
    position: absolute;
    top: -18px;
    left: -10px;
    width: 54px;
    height: 24px;
    background: #111;
    border-radius: 14px;
  }

  .window {
    position: absolute;
    left: 85px;
    top: 18px;
    width: 44px;
    height: 44px;
    background: radial-gradient(circle at 35% 30%, #ffd27a, #ff9800 65%, #d86f00);
    border: 7px solid #1f1f1f;
    border-radius: 50%;
    z-index: 3;
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.6);
  }

  .wheel {
    position: absolute;
    bottom: 0;
    width: 74px;
    height: 74px;
    background: radial-gradient(circle, #d9d9d9 0 28%, #222 30% 62%, #050505 64%);
    border-radius: 50%;
    border: 5px solid #111;
    box-shadow: 0 8px 14px rgba(0,0,0,0.35);
    z-index: 3;
    animation: rotateWheel 2s linear infinite;
  }

  @keyframes rotateWheel {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .wheel.left { left: 48px; }
  .wheel.right { right: 48px; }
</style>
</head>

<body>
  <div class="vehicle">
    <!-- حاوية الدخان -->
    <div class="smoke-container">
      <div class="smoke"></div>
      <div class="smoke"></div>
      <div class="smoke"></div>
      <div class="smoke"></div> <!-- إضافة جزئ إضافي لكثافة أعلى -->
    </div>

    <div class="pipe"></div>

    <div class="cabin">
      <div class="window"></div>
    </div>

    <div class="body"></div>

    <div class="wheel left"></div>
    <div class="wheel right"></div>
  </div>
</body>
</html>
