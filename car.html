<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Clean Robot Vehicle</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(180deg, #e9e9e9, #bdbdbd);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .vehicle {
    position: relative;
    width: 430px;
    height: 170px;
  }

  .body {
    position: absolute;
    bottom: 28px;
    width: 430px;
    height: 105px;
    background: linear-gradient(180deg, #ffffff 0%, #f1f1f1 100%);
    border: 4px solid #3f3f3f;
    border-radius: 42px 42px 28px 28px;
    box-shadow: 0 18px 30px rgba(0,0,0,0.25);
  }

  .body::after {
    content: "";
    position: absolute;
    top: 52px;
    left: 22px;
    right: 22px;
    height: 3px;
    background: #8a8a8a;
    border-radius: 10px;
  }

  .cabin {
    position: absolute;
    left: 145px;
    bottom: 108px;
    width: 160px;
    height: 78px;
    background: linear-gradient(180deg, #ffffff 0%, #eeeeee 100%);
    border: 4px solid #3f3f3f;
    border-radius: 34px 46px 24px 24px;
    box-shadow: 0 8px 15px rgba(0,0,0,0.15);
  }

  .cabin::after {
    content: "";
    position: absolute;
    right: -38px;
    bottom: -4px;
    width: 70px;
    height: 78px;
    background: linear-gradient(180deg, #ffffff 0%, #eeeeee 100%);
    border-right: 4px solid #3f3f3f;
    border-bottom: 4px solid #3f3f3f;
    border-radius: 0 45px 24px 0;
    transform: skewX(28deg);
  }

  .pipe {
    position: absolute;
    left: 185px;
    bottom: 185px;
    width: 34px;
    height: 62px;
    background: linear-gradient(90deg, #111, #333, #111);
    border-radius: 12px;
    border: 4px solid #111;
  }

  .pipe::before {
    content: "";
    position: absolute;
    top: -18px;
    left: -10px;
    width: 54px;
    height: 24px;
    background: #111;
    border-radius: 14px;
  }

  .pipe::after {
    content: "";
    position: absolute;
    top: -11px;
    left: 5px;
    width: 24px;
    height: 8px;
    background: #777;
    border-radius: 8px;
  }

  .window {
    position: absolute;
    left: 85px;
    top: 18px;
    width: 44px;
    height: 44px;
    background: radial-gradient(circle at 35% 30%, #ffd27a, #ff9800 65%, #d86f00);
    border: 7px solid #1f1f1f;
    border-radius: 50%;
    z-index: 3;
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.6);
  }

  .wheel {
    position: absolute;
    bottom: 0;
    width: 74px;
    height: 74px;
    background: radial-gradient(circle, #d9d9d9 0 28%, #222 30% 62%, #050505 64%);
    border-radius: 50%;
    border: 5px solid #111;
    box-shadow: 0 8px 14px rgba(0,0,0,0.35);
  }

  .wheel.left {
    left: 48px;
  }

  .wheel.right {
    right: 48px;
  }
</style>
</head>

<body>
  <div class="vehicle">
    <div class="pipe"></div>

    <div class="cabin">
      <div class="window"></div>
    </div>

    <div class="body"></div>

    <div class="wheel left"></div>
    <div class="wheel right"></div>
  </div>
</body>
</html>
